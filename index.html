
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a11">
  <title>SUIII_STREAM</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #080a11;
      --panel: #121526;
      --card: #22263a;
      --purple: #8957f5;
      --text: #f5f5fb;
      --muted: #a8adbf;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      background: var(--panel);
      padding: 25px 18px;
    }

    h1 {
      color: #bca0ff;
      font-size: 32px;
      margin: 0 0 7px;
      overflow-wrap: anywhere;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .search {
      display: flex;
      gap: 8px;
      margin-top: 22px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: var(--card);
      color: white;
      font-size: 15px;
    }

    button {
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      background: var(--purple);
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    main {
      padding: 22px 16px;
      min-height: 65vh;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tabs button {
      flex: 1;
      background: var(--card);
    }

    .tabs button.active { background: #6539d0; }

    h2 { font-size: 23px; }

    #message {
      color: #c4b5fd;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .movie {
      background: var(--panel);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .movie img {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      background: var(--card);
    }

    .movie-info { padding: 10px; }

    .movie-title {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
    }

    .year {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .back {
      background: var(--card);
      margin-bottom: 15px;
    }

    .detail-poster {
      width: 100%;
      max-width: 270px;
      display: block;
      border-radius: 12px;
      margin: 5px 0 18px;
    }

    .overview {
      color: #c1c5d4;
      line-height: 1.7;
      font-size: 14px;
    }

    .wide {
      display: block;
      padding: 15px;
      margin: 13px 0;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      color: white;
      background: var(--purple);
    }

    select {
      width: 100%;
      padding: 14px;
      background: var(--card);
      color: white;
      border: 0;
      border-radius: 10px;
      margin: 10px 0;
    }

    .episode {
      padding: 14px;
      background: var(--panel);
      border-radius: 12px;
      margin: 10px 0;
    }

    .creator {
      text-align: center;
      padding: 20px 10px;
      margin: 20px 16px 0;
      border-top: 1px solid #29243b;
      color: #c4b5fd;
      font-size: 14px;
    }

    .creator a {
      color: #c4b5fd;
      font-weight: bold;
      text-decoration: none;
    }

    .small-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
      padding: 25px 5px;
    }

    .hidden { display: none !important; }

    @media (min-width: 650px) {
      header, main {
        max-width: 950px;
        margin: auto;
      }

      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

      .creator {
        max-width: 918px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>SUIII_STREAM</h1>
    <div class="subtitle">MOVIES · TV SERIES · TRAILERS</div>

    <form class="search" id="searchForm">
      <input
        id="searchInput"
        type="search"
        placeholder="Search movies or TV series..."
        aria-label="Search titles"
      >
      <button type="submit">Search</button>
    </form>
  </header>

  <main>
    <div class="tabs">
      <button id="movieTab" class="active" type="button">Movies</button>
      <button id="tvTab" type="button">TV Series</button>
    </div>

    <section id="resultsView">
      <h2 id="sectionTitle">Trending Movies</h2>
      <p id="message">Loading titles...</p>
      <div id="results" class="grid"></div>
    </section>

    <section id="detailView" class="hidden">
      <button id="backButton" class="back" type="button">← Back</button>
      <div id="details"></div>
    </section>

    <div class="small-note">
      This product uses the TMDB API but is not endorsed or
      certified by TMDB.
    </div>
  </main>

  <footer class="creator">
    Create by
    <a href="https://t.me/MG1SHWE"
       target="_blank"
       rel="noopener noreferrer">@MG1SHWE</a>
  </footer>

  <script>
    // Add your TMDB API key here for local testing.
    // Do not publish your private key in a public repository.
    const TMDB_API_KEY = "ec66de9180a4c0d4e6e8a4807a403acc";

    const API = "https://api.themoviedb.org/3";
    const IMG = "https://image.tmdb.org/t/p/w500";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const $ = id => document.getElementById(id);

    let currentType = "movie";
    let lastQuery = "";
    let detailId = null;
    let requestNumber = 0;

    function escapeHTML(value = "") {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[ch]);
    }

    function titleOf(item, type = currentType) {
      return type === "movie" ? item.title : item.name;
    }

    function yearOf(item, type = currentType) {
      const date = type === "movie"
        ? item.release_date
        : item.first_air_date;

      return date ? date.slice(0, 4) : "Year unknown";
    }

    function imageURL(path) {
      return path ? IMG + path : "";
    }

    function showMessage(text) {
      $("message").textContent = text;
      $("message").classList.remove("hidden");
    }

    function hideMessage() {
      $("message").classList.add("hidden");
    }

    async function api(path) {
      if (
        !TMDB_API_KEY ||
        TMDB_API_KEY === "ec66de9180a4c0d4e6e8a4807a403acc"
      ) {
        throw new Error(
          "Add your TMDB API key in index.html first."
        );
      }

      const separator = path.includes("?") ? "&" : "?";
      const url = API + path + separator +
        "api_key=" + encodeURIComponent(TMDB_API_KEY);

      const response = await fetch(url);

      if (!response.ok) {
        if (response.status === 401) {
          throw new Error(
            "API key invalid. Check your TMDB API settings."
          );
        }

        throw new Error(
          "TMDB request failed (" + response.status + ")."
        );
      }

      return response.json();
    }

    function showResultsView() {
      $("resultsView").classList.remove("hidden");
      $("detailView").classList.add("hidden");
      detailId = null;
    }

    async function loadTitles(query = "") {
      const myRequest = ++requestNumber;

      lastQuery = query.trim();
      showResultsView();
      $("results").innerHTML = "";
      $("sectionTitle").textContent = lastQuery
        ? "Search Results"
        : "Trending " +
          (currentType === "movie" ? "Movies" : "TV Series");

      showMessage("Loading titles...");

      try {
        let path;

        if (lastQuery) {
          path = "/" + currentType + "/search?query=" +
            encodeURIComponent(lastQuery);
        } else {
          path = "/trending/" + currentType + "/week";
        }

        const data = await api(path);

        if (myRequest !== requestNumber) return;

        const items = (data.results || []).filter(item =>
          item.poster_path && titleOf(item)
        );

        if (!items.length) {
          showMessage("No results found. Try another title.");
          return;
        }

        hideMessage();

        $("results").innerHTML = items.map(item => {
          const id = Number(item.id);
          const title = escapeHTML(titleOf(item));
          const year = escapeHTML(yearOf(item));

          return `
            <article class="movie"
              data-id="${id}"
              role="button"
              tabindex="0"
              aria-label="${title}">
              <img
                src="${imageURL(item.poster_path)}"
                alt="${title}"
                loading="lazy"
              >
              <div class="movie-info">
                <div class="movie-title">${title}</div>
                <div class="year">${year}</div>
              </div>
            </article>
          `;
        }).join("");

        $("results").querySelectorAll(".movie").forEach(card => {
          const open = () =>
            showDetails(Number(card.dataset.id));

          card.addEventListener("click", open);

          card.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              open();
            }
          });
        });
      } catch (error) {
        if (myRequest === requestNumber) {
          showMessage(error.message || "Something went wrong.");
        }
      }
    }

    async function showDetails(id) {
      detailId = id;
      const myRequest = ++requestNumber;

      $("resultsView").classList.add("hidden");
      $("detailView").classList.remove("hidden");
      $("details").innerHTML = "<p>Loading details...</p>";

      window.scrollTo(0, 0);

      try {
        const item = await api(
          "/" + currentType + "/" + id +
          "?append_to_response=videos"
        );

        if (myRequest !== requestNumber || detailId !== id) return;

        const title = titleOf(item);
        const year = yearOf(item);
        const rating = Number(item.vote_average || 0).toFixed(1);
        const overview = item.overview || "No overview available.";

        const videos = item.videos?.results || [];

        const trailer = videos.find(v =>
          v.site === "YouTube" &&
          v.type === "Trailer" &&
          v.official
        ) || videos.find(v =>
          v.site === "YouTube" &&
          v.type === "Trailer"
        ) || videos.find(v => v.site === "YouTube");

        let html = `
          ${item.poster_path ? `
            <img class="detail-poster"
              src="${imageURL(item.poster_path)}"
              alt="${escapeHTML(title)}">
          ` : ""}

          <h2>${escapeHTML(title)}</h2>
          <p class="year">${escapeHTML(year)} · Rating ${rating}/10</p>
          <p class="overview">${escapeHTML(overview)}</p>
        `;

        if (trailer) {
          html += `
            <a class="wide"
              href="https://www.youtube.com/watch?v=${encodeURIComponent(trailer.key)}"
              target="_blank"
              rel="noopener noreferrer">
              ▶ Watch Official Trailer
            </a>
          `;
        } else {
          html += `<p class="year">No official trailer found.</p>`;
        }

        if (currentType === "tv") {
          const seasons = (item.seasons || []).filter(
            season => season.season_number > 0
          );

          html += `
            <h2>TV Seasons & Episodes</h2>
            <label for="seasonSelect">Choose Season</label>
            <select id="seasonSelect">
              ${seasons.map(season => `
                <option value="${Number(season.season_number)}">
                  ${escapeHTML(season.name)}
                </option>
              `).join("")}
            </select>
            <div id="episodes"></div>
          `;
        }

        $("details").innerHTML = html;

        if (currentType === "tv") {
          const select = $("seasonSelect");

          if (select && select.options.length) {
            select.addEventListener("change", () => {
              loadEpisodes(id, Number(select.value));
            });

            loadEpisodes(id, Number(select.value));
          } else {
            $("details").insertAdjacentHTML(
              "beforeend",
              "<p class='year'>No seasons listed.</p>"
            );
          }
        }
      } catch (error) {
        if (myRequest === requestNumber) {
          $("details").innerHTML =
            `<p class="overview">${escapeHTML(error.message)}</p>`;
        }
      }
    }

    async function loadEpisodes(showId, seasonNumber) {
      const container = $("episodes");
      if (!container) return;

      container.innerHTML = "<p>Loading episodes...</p>";

      try {
        const season = await api(
          "/tv/" + showId + "/season/" + seasonNumber
        );

        if (!container.isConnected) return;

        const episodes = season.episodes || [];

        if (!episodes.length) {
          container.textContent = "No episodes listed.";
          return;
        }

        container.innerHTML = episodes.map(episode => `
          <article class="episode">
            <strong>
              ${Number(episode.episode_number)}.
              ${escapeHTML(episode.name || "Untitled episode")}
            </strong>
            <p class="overview">
              ${escapeHTML(
                episode.overview || "No episode description available."
              )}
            </p>
            <p class="year">
              ${episode.air_date
                ? "Air date: " + escapeHTML(episode.air_date)
                : ""}
            </p>
          </article>
        `).join("");
      } catch (error) {
        if (container.isConnected) {
          container.textContent = error.message;
        }
      }
    }

    $("searchForm").addEventListener("submit", event => {
      event.preventDefault();
      loadTitles($("searchInput").value);
    });

    $("movieTab").addEventListener("click", () => {
      currentType = "movie";
      $("movieTab").classList.add("active");
      $("tvTab").classList.remove("active");
      loadTitles($("searchInput").value);
    });

    $("tvTab").addEventListener("click", () => {
      currentType = "tv";
      $("tvTab").classList.add("active");
      $("movieTab").classList.remove("active");
      loadTitles($("searchInput").value);
    });

    $("backButton").addEventListener("click", () => {
      requestNumber++;
      showResultsView();
      window.scrollTo(0, 0);
    });

    loadTitles();
  </script>
</body>
</html>
