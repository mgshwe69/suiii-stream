<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0e">
  <title>SUIII_STREAM — Ultimate OTT Platform</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0e;
      --panel: rgba(20, 20, 25, 0.9);
      --panel-solid: #141419;
      --panel2: rgba(28, 28, 36, 0.95);
      --text: #f3f3f6;
      --muted: #9595a6;
      --accent: #f5c518;
      --accent-hover: #e0b010;
      --line: rgba(255, 255, 255, 0.08);
      --card-bg: rgba(19, 19, 24, 0.8);
      --glass-blur: blur(20px);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11, 11, 14, 0.85); backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--line);
    }
    .top {
      max-width: 1350px; margin: auto; padding: 14px 20px;
      display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    }
    .brand { font-weight: 900; font-size: 1.4rem; color: #fff; cursor: pointer; }
    .brand span { color: var(--accent); }
    .search-container { position: relative; flex: 1; max-width: 450px; }
    form { display: flex; gap: 8px; width: 100%; }
    input[type="search"] {
      width: 100%; background: var(--panel); border: 1px solid var(--line);
      color: var(--text); padding: 10px 16px; border-radius: 12px; font: inherit; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--accent); color: #000; border: 0; border-radius: 10px;
      padding: 10px 18px; font: inherit; font-weight: 800; cursor: pointer;
    }
    button.secondary { background: var(--panel2); color: #fff; border: 1px solid var(--line); }

    main { max-width: 1350px; margin: auto; padding: 0 20px 60px; }
    .hero-feature {
      margin-top: 24px; position: relative; border-radius: 20px; overflow: hidden;
      min-height: 400px; display: flex; align-items: flex-end; padding: 40px;
      background-size: cover; background-position: center; border: 1px solid var(--line);
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(11,11,14,0.1) 0%, rgba(11,11,14,0.85) 60%, var(--bg) 100%),
                  linear-gradient(90deg, rgba(11,11,14,0.9) 0%, rgba(11,11,14,0.4) 50%, transparent 100%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 650px; }
    .hero-content h1 { font-size: clamp(2rem, 4vw, 3.2rem); margin: 0 0 12px; font-weight: 900; }
    
    .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 32px 0 20px; }
    .tabs button { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 12px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
    .tabs button.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 20px; }
    .card {
      background: var(--card-bg); border: 1px solid var(--line); border-radius: 14px;
      overflow: hidden; cursor: pointer; transition: transform 0.25s;
    }
    .card:hover { transform: translateY(-6px); border-color: var(--accent); }
    .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #1a1a24; display: block; }
    .card-info { padding: 12px; }
    .card-title { font-weight: 700; font-size: .92rem; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .detail {
      background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
      padding: 30px; margin-top: 24px; display: grid; grid-template-columns: minmax(220px, 280px) 1fr; gap: 30px;
    }
    @media (max-width: 768px) { .detail { grid-template-columns: 1fr; } }
    .detail img { width: 100%; border-radius: 16px; }

    .projection-container { margin-top: 24px; background: var(--card-bg); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
    .projection-header { padding: 16px 20px; background: var(--panel2); display: flex; justify-content: space-between; align-items: center; }
    .projection-player { width: 100%; aspect-ratio: 16/9; background: #000; }
    .player-frame { width: 100%; height: 100%; border: 0; }

    .servers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 16px; }
    .server-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; text-align: center; font-size: .85rem; font-weight: 700; }
    .server-card.active { border-color: var(--accent); background: rgba(255,255,255,0.08); }

    footer { border-top: 1px solid var(--line); padding: 30px 20px; text-align: center; color: var(--muted); margin-top: 50px; background: var(--panel); }
    footer a { color: var(--accent); text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand" id="brandHome">SUIII<span>_STREAM</span></div>
    <div class="search-container">
      <form id="searchForm" autocomplete="off">
        <input id="searchInput" type="search" placeholder="Search Bigg Boss, Serials, Movies, Anime...">
        <button type="submit">Search</button>
      </form>
    </div>
  </div>
</header>

<main id="app">
  <section id="heroBanner" class="hero-feature" style="background-image: url('https://m.media-amazon.com/images/M/MV5BNTIxZDgwOWItMzRmYS00NDk3LWEyNTctYjU3YjMyNDU4ZDViXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg');">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="feature-tag" style="color:var(--accent); font-weight:800;">TOP FEATURED</div>
      <h1 id="heroTitle">Bigg Boss Season 18</h1>
      <div class="hero-meta" style="display:flex; gap:12px; align-items:center; margin-bottom:14px; color:#d1d1d6;">
        <span style="color:var(--accent); font-weight:800;">★ 8.9</span>
        <span>2026</span>
      </div>
      <p style="color:var(--muted); margin-bottom:20px;">Stream full episodes of Indian reality shows, popular TV serials, and blockbusters instantly.</p>
      <button type="button" id="heroPlayBtn">▶ Play Stream</button>
    </div>
  </section>

  <nav class="tabs" id="categoryTabs">
    <button data-kind="trending" class="active">🔥 Trending</button>
    <button data-kind="biggboss">👁️ Bigg Boss & Reality</button>
    <button data-kind="serials">📺 TV Serials</button>
    <button data-kind="movies">🎬 Movies</button>
    <button data-kind="anime">🌸 Anime</button>
  </nav>

  <section id="resultsSection">
    <div class="section-head"><h2 id="resultsTitle">Top Trending Content</h2></div>
    <div id="results" class="grid"></div>
  </section>

  <section id="detailSection" hidden></section>
</main>

<footer>
  © <span id="year"></span> SUIII_STREAM · Created with ❤️ by <a href="https://t.me/MG1SHWE" target="_blank" rel="noopener">@MG1SHWE</a>
</footer>

<script>
(() => {
  "use strict";

  const resultsEl = document.getElementById("results");
  const resultsTitle = document.getElementById("resultsTitle");
  const resultsSection = document.getElementById("resultsSection");
  const detailSection = document.getElementById("detailSection");
  const heroBanner = document.getElementById("heroBanner");
  const searchInput = document.getElementById("searchInput");

  document.getElementById("year").textContent = new Date().getFullYear();
  document.getElementById("brandHome").addEventListener("click", () => loadCatalog("trending"));

  const MASTER_DATABASE = [
    { id: "tt32832804", title: "Bigg Boss", year: "2025", type: "tv", category: "biggboss", poster: "https://m.media-amazon.com/images/M/MV5BNTIxZDgwOWItMzRmYS00NDk3LWEyNTctYjU3YjMyNDU4ZDViXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt0407362", title: "Khatron Ke Khiladi", year: "2025", type: "tv", category: "biggboss", poster: "https://m.media-amazon.com/images/M/MV5BZmM0Y2Y0YmMtZjAxYi00YTMxLWE2NWYtYTFkOWUxYTU1NDJhXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt10323382", title: "Lock Upp", year: "2022", type: "tv", category: "biggboss", poster: "https://m.media-amazon.com/images/M/MV5BNGU5YTAzZGEtZDJkMy00ZGI2LWEwZjItY2I3Y2E2NmI1YTA1XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt20242530", title: "MTV Roadies", year: "2023", type: "tv", category: "biggboss", poster: "https://m.media-amazon.com/images/M/MV5BZDA4YmJhMDUtZDliYS00Mzg3LWE4NDgtYTU2YzE1MmJkNTM3XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt2221650", title: "Anupamaa", year: "2020", type: "tv", category: "serials", poster: "https://m.media-amazon.com/images/M/MV5BYzA2ZDk1NDgtNDRiMC00YzY5LTljNzgtM2U5NDcyNzA5MmM0XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt10086884", title: "Yeh Rishta Kya Kehlata Hai", year: "2009", type: "tv", category: "serials", poster: "https://m.media-amazon.com/images/M/MV5BN2EwYTI5N2MtZGI0My00ZTg3LWIyNDAtYTA5ZDQ2NDNmZmNkXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt3863552", title: "Taarak Mehta Ka Ooltah Chashmah", year: "2008", type: "tv", category: "serials", poster: "https://m.media-amazon.com/images/M/MV5BMjA3OTI2N2MtMmYzMC00NDU4LWE0MzMtYjE3NTA2YWEzZmYxXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt2083658", title: "Ghum Hai Kisikey Pyaar Meiin", year: "2020", type: "tv", category: "serials", poster: "https://m.media-amazon.com/images/M/MV5BZDFiN2UxNWUtMWE5NC00ZGE4LWI4NDItZTI5YjJkYzc5MWM0XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt10874608", title: "Pushpa 2: The Rule", year: "2024", type: "movie", category: "movies", poster: "https://m.media-amazon.com/images/M/MV5BNGFiMDFjNDAtOWM5NC00ZGE4LWI4OTAtOTJkM2I5MGFmOTU0XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt15239678", title: "Dune: Part Two", year: "2024", type: "movie", category: "movies", poster: "https://m.media-amazon.com/images/M/MV5BN2QyZGU4ZDctOWMzMy00NTc5LThlOGQtODhmNDI1NmY5YzAwXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt9362722", title: "Spider-Man: Across the Spider-Verse", year: "2023", type: "movie", category: "movies", poster: "https://m.media-amazon.com/images/M/MV5BMzI0NmJjNDgtNGExMS00NGRjLTg3NzAtYWFiZjdhNTRkYTNlXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt0816692", title: "Interstellar", year: "2014", type: "movie", category: "movies", poster: "https://m.media-amazon.com/images/M/MV5BYzdjMDAxZGItMjI2My00ODA1LTlkNzItOWFjMDU5ZDJlYWY3XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt9335498", title: "Demon Slayer", year: "2019", type: "tv", category: "anime", poster: "https://m.media-amazon.com/images/M/MV5BZjZjNzI5MDctY2Y4YS00NmM4LTljMmItZTFkOTExNGI3ODRhXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
    { id: "tt2560140", title: "Attack on Titan", year: "2013", type: "tv", category: "anime", poster: "https://m.media-amazon.com/images/M/MV5BMTY5ODk1NzUyMl5BMl5BanBnXkFtZTgwMjUyNjgwODE@._V1_FMjpg_UX1000_.jpg" }
  ];

  function cardMarkup(item) {
    return `
      <article class="card" data-id="${item.id}" data-type="${item.type}">
        <img class="poster" loading="lazy" src="${item.poster}" alt="">
        <div class="card-info">
          <p class="card-title">${item.title}</p>
          <div style="display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted);">
            <span>${item.year}</span>
            <span style="color:var(--accent); font-weight:700;">★ 8.5</span>
          </div>
        </div>
      </article>
    `;
  }

  function loadCatalog(category) {
    detailSection.hidden = true; heroBanner.hidden = false; resultsSection.hidden = false;
    document.querySelectorAll("#categoryTabs button").forEach(b => b.classList.toggle("active", b.dataset.kind === category));

    let list = category === "trending" ? MASTER_DATABASE : MASTER_DATABASE.filter(i => i.category === category);
    resultsTitle.textContent = category.toUpperCase() + " SHOWS & MOVIES";
    resultsEl.innerHTML = list.map(cardMarkup).join("");
  }

  document.getElementById("heroPlayBtn").addEventListener("click", () => {
    openDetails("tt32832804", "tv", "Bigg Boss Season 18");
  });

  // INSTANT LOCAL SEARCH (0 ERROR, 0 DELAY)
  document.getElementById("searchForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const query = searchInput.value.trim().toLowerCase();
    if (!query) return;

    resultsTitle.textContent = `Search Results: ${searchInput.value}`;
    const filtered = MASTER_DATABASE.filter(i => i.title.toLowerCase().includes(query));

    if (filtered.length > 0) {
      resultsEl.innerHTML = filtered.map(cardMarkup).join("");
    } else {
      resultsEl.innerHTML = "<p style='grid-column:1/-1; text-align:center;'>No matching content found.</p>";
    }
  });

  const SERVERS = [
    { id: "vidsrc", name: "HD Server 1" },
    { id: "embedsu", name: "HD Server 2" },
    { id: "multiembed", name: "VIP Server 3" }
  ];

  function getPlayerUrl(imdbId, type, season=1, episode=1, server="vidsrc") {
    if (type === "movie") {
      if (server === "vidsrc") return `https://vidsrc.to/embed/movie/${imdbId}`;
      if (server === "embedsu") return `https://embed.su/embed/movie/${imdbId}`;
      return `https://multiembed.mov/?video_id=${imdbId}`;
    } else {
      if (server === "vidsrc") return `https://vidsrc.to/embed/tv/${imdbId}/${season}/${episode}`;
      if (server === "embedsu") return `https://embed.su/embed/tv/${imdbId}/${season}/${episode}`;
      return `https://multiembed.mov/?video_id=${imdbId}&s=${season}&e=${episode}`;
    }
  }

  function openDetails(imdbId, type, titleName) {
    detailSection.hidden = true; heroBanner.hidden = true; resultsSection.hidden = true;

    detailSection.innerHTML = `
      <button type="button" class="secondary" id="backBtn" style="margin-bottom:20px;">← Back</button>
      <h2>🎬 ${titleName || 'Stream Content'}</h2>
      <div class="projection-container">
        <div class="projection-header"><strong>FULL HD STREAMING PLAYER</strong></div>
        <div class="projection-player"><iframe id="videoIframe" class="player-frame" allowfullscreen></iframe></div>
        <div class="servers-grid">
          ${SERVERS.map((s, idx) => `<div class="server-card ${idx===0?'active':''}" data-server="${s.id}">${s.name}</div>`).join("")}
        </div>
      </div>
    `;

    detailSection.hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });

    document.getElementById("backBtn").addEventListener("click", () => {
      detailSection.hidden = true; heroBanner.hidden = false; resultsSection.hidden = false;
    });

    let activeServer = "vidsrc";
    const videoIframe = document.getElementById("videoIframe");
    videoIframe.src = getPlayerUrl(imdbId, type, 1, 1, activeServer);

    document.querySelectorAll(".server-card").forEach(sc => {
      sc.addEventListener("click", () => {
        document.querySelectorAll(".server-card").forEach(x => x.classList.remove("active"));
        sc.classList.add("active");
        activeServer = sc.dataset.server;
        videoIframe.src = getPlayerUrl(imdbId, type, 1, 1, activeServer);
      });
    });
  }

  document.addEventListener("click", e => {
    const card = e.target.closest(".card");
    if (card && card.dataset.id) {
      const title = card.querySelector(".card-title") ? card.querySelector(".card-title").textContent : "";
      openDetails(card.dataset.id, card.dataset.type || "movie", title);
    }
  });

  document.querySelectorAll("#categoryTabs button").forEach(b => {
    b.addEventListener("click", () => loadCatalog(b.dataset.kind));
  });

  loadCatalog("trending");
})();
</script>
</body>
</html>
