<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0e">
  <title>SUIII_STREAM — Ultimate OTT & Reality Hub</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0e;
      --panel: rgba(20, 20, 25, 0.9);
      --panel-solid: #141419;
      --panel2: rgba(28, 28, 36, 0.95);
      --text: #f3f3f6;
      --muted: #9595a6;
      --accent: #f5c518;
      --accent-hover: #e0b010;
      --line: rgba(255, 255, 255, 0.08);
      --card-bg: rgba(19, 19, 24, 0.8);
      --glass-blur: blur(20px);
    }
    [data-theme="anime"] { --accent: #ec4899; --accent-hover: #db2777; }
    [data-theme="football"] { --accent: #22c55e; --accent-hover: #16a34a; }
    [data-theme="reality"], [data-theme="serials"] { --accent: #e50914; --accent-hover: #b9090b; }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11, 11, 14, 0.85); backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--line);
    }
    .top {
      max-width: 1350px; margin: auto; padding: 14px 20px;
      display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    }
    .menu-toggle, .plugin-btn {
      background: var(--panel2); border: 1px solid var(--line); color: #fff;
      padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 800;
    }
    .brand { font-weight: 900; font-size: 1.4rem; color: #fff; cursor: pointer; }
    .brand span { color: var(--accent); }
    .search-container { position: relative; flex: 1; max-width: 450px; }
    form { display: flex; gap: 8px; width: 100%; }
    input[type="search"] {
      width: 100%; background: var(--panel); border: 1px solid var(--line);
      color: var(--text); padding: 10px 16px; border-radius: 12px; font: inherit; outline: none;
    }
    input:focus { border-color: var(--accent); }
    .suggestions-box {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--panel-solid); border: 1px solid var(--line);
      border-radius: 12px; margin-top: 6px; z-index: 200; max-height: 300px; overflow-y: auto;
    }
    .suggestion-item {
      padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--line);
      font-size: .9rem; display: flex; justify-content: space-between; align-items: center;
    }
    .suggestion-item:hover { background: var(--panel2); color: var(--accent); }
    button {
      background: var(--accent); color: #000; border: 0; border-radius: 10px;
      padding: 10px 18px; font: inherit; font-weight: 800; cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: var(--panel2); color: #fff; border: 1px solid var(--line); }

    main { max-width: 1350px; margin: auto; padding: 0 20px 60px; }
    .hero-feature {
      margin-top: 24px; position: relative; border-radius: 20px; overflow: hidden;
      min-height: 440px; display: flex; align-items: flex-end; padding: 40px;
      background-size: cover; background-position: center; border: 1px solid var(--line);
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(11,11,14,0.1) 0%, rgba(11,11,14,0.85) 60%, var(--bg) 100%),
                  linear-gradient(90deg, rgba(11,11,14,0.9) 0%, rgba(11,11,14,0.4) 50%, transparent 100%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 650px; }
    .hero-content h1 { font-size: clamp(2.2rem, 4vw, 3.5rem); margin: 0 0 12px; font-weight: 900; }
    
    .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 32px 0 20px; }
    .tabs button { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 12px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
    .tabs button.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; }
    .card {
      background: var(--card-bg); border: 1px solid var(--line); border-radius: 14px;
      overflow: hidden; cursor: pointer; transition: transform 0.25s;
    }
    .card:hover { transform: translateY(-6px); border-color: var(--accent); }
    .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #1a1a24; display: block; }
    .card-info { padding: 12px; }
    .card-title { font-weight: 700; font-size: .92rem; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .status { padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font-weight: 700; text-align: center; margin: 20px 0; }
    
    .detail {
      background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
      padding: 30px; margin-top: 24px; display: grid; grid-template-columns: minmax(220px, 280px) 1fr; gap: 30px;
    }
    @media (max-width: 768px) { .detail { grid-template-columns: 1fr; } }
    .detail img { width: 100%; border-radius: 16px; }

    .projection-container { margin-top: 24px; background: var(--card-bg); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
    .projection-header { padding: 16px 20px; background: var(--panel2); display: flex; justify-content: space-between; align-items: center; }
    .projection-player { width: 100%; aspect-ratio: 16/9; background: #000; }
    .player-frame { width: 100%; height: 100%; border: 0; }

    .servers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 16px; }
    .server-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; text-align: center; font-size: .85rem; font-weight: 700; }
    .server-card.active { border-color: var(--accent); background: rgba(255,255,255,0.08); }

    footer { border-top: 1px solid var(--line); padding: 30px 20px; text-align: center; color: var(--muted); margin-top: 50px; background: var(--panel); }
    footer a { color: var(--accent); text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>

<header>
  <div class="top">
    <button type="button" class="menu-toggle" id="brandHome">SUIII<span>_STREAM</span></button>
    <div class="search-container">
      <form id="searchForm" role="search" autocomplete="off">
        <input id="searchInput" type="search" placeholder="Search Bigg Boss, Serials, Movies..." aria-label="Search">
      </form>
      <div id="suggestionsBox" class="suggestions-box" hidden></div>
    </div>
    <button type="button" class="plugin-btn" id="pluginsNavBtn">⚡ Plugins</button>
  </div>
</header>

<main id="app">
  <section id="heroBanner" class="hero-feature">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="feature-tag" style="color:var(--accent); font-weight:800;">FEATURED BLOCKBUSTER</div>
      <h1 id="heroTitle">Loading...</h1>
      <div class="hero-meta" style="display:flex; gap:12px; align-items:center; margin-bottom:14px; color:#d1d1d6;">
        <span id="heroRating" style="color:var(--accent); font-weight:800;">★ 8.8</span>
        <span id="heroYear">2026</span>
      </div>
      <p id="heroOverview" style="color:var(--muted); margin-bottom:20px;">Loading overview...</p>
      <button type="button" id="heroPlayBtn">▶ Watch Now</button>
    </div>
  </section>

  <nav class="tabs" id="categoryTabs">
    <button data-kind="all" class="active">🔥 Trending</button>
    <button data-kind="reality">👁️ Bigg Boss & Reality</button>
    <button data-kind="serials">📺 TV Serials</button>
    <button data-kind="movie">🎬 Movies</button>
    <button data-kind="anime">🌸 Anime</button>
    <button data-kind="football">⚽ Live Sports</button>
  </nav>

  <div id="status" class="status" hidden>Loading content...</div>

  <section id="resultsSection">
    <div class="section-head"><h2 id="resultsTitle">Top Trending Today</h2></div>
    <div id="results" class="grid"></div>
  </section>

  <section id="detailSection" hidden></section>

  <section id="pluginsSection" hidden>
    <button type="button" class="secondary" id="backToMovies" style="margin-bottom:20px;">← Back to Explore</button>
    <div class="section-head"><h2>Plugin Center ⚡</h2></div>
    <div class="status">CloudStream .cs3 plugin catalog integrated for extra sources.</div>
    <div id="pluginResults" class="grid" style="margin-top:20px;"></div>
  </section>
</main>

<footer>
  © <span id="year"></span> SUIII_STREAM · Created with ❤️ by <a href="https://t.me/MG1SHWE" target="_blank" rel="noopener">@MG1SHWE</a>
</footer>

<script>
(() => {
  "use strict";

  const TMDB_API_KEY = "3fd2be6f0c70a2a598f084dd23308886";
  const IMG = "https://image.tmdb.org/t/p/w500";
  const IMG_ORIG = "https://image.tmdb.org/t/p/original";

  const resultsEl = document.getElementById("results");
  const resultsTitle = document.getElementById("resultsTitle");
  const resultsSection = document.getElementById("resultsSection");
  const detailSection = document.getElementById("detailSection");
  const heroBanner = document.getElementById("heroBanner");
  const searchInput = document.getElementById("searchInput");
  const pluginsSection = document.getElementById("pluginsSection");

  document.getElementById("year").textContent = new Date().getFullYear();
  document.getElementById("brandHome").addEventListener("click", () => loadContent("all"));

  document.getElementById("pluginsNavBtn").addEventListener("click", () => {
    resultsSection.hidden = true; detailSection.hidden = true; heroBanner.hidden = true; pluginsSection.hidden = false;
    renderPlugins();
  });
  document.getElementById("backToMovies").addEventListener("click", () => {
    pluginsSection.hidden = true; heroBanner.hidden = false; resultsSection.hidden = false; loadContent(currentKind);
  });

  const FALLBACK_PLUGINS = [
    { name: "Bollyflix", version: 33, description: "Movies and Series upto 4K", url: "https://raw.githubusercontent.com/SaurabhKaperwan/CSX/builds/Bollyflix.cs3" },
    { name: "CineStream", version: 487, description: "All in one streaming extension", url: "https://raw.githubusercontent.com/SaurabhKaperwan/CSX/builds/CineStream.cs3" }
  ];
  function renderPlugins() {
    document.getElementById("pluginResults").innerHTML = FALLBACK_PLUGINS.map(p => `
      <div class="card" style="padding:16px;">
        <h3>${p.name} <span style="color:var(--accent);">v${p.version}</span></h3>
        <p style="color:var(--muted); font-size:.85rem;">${p.description}</p>
        <a href="${p.url}" target="_blank" style="color:var(--accent); font-size:.85rem; text-decoration:none;">Download .cs3 ↗</a>
      </div>
    `).join("");
  }

  async function api(path) {
    const target = `https://api.themoviedb.org/3${path}${path.includes('?') ? '&' : '?'}api_key=${TMDB_API_KEY}`;
    const fetchWithTimeout = async (url) => {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), 4000);
      try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(id);
        if (res.ok) return await res.json();
      } catch(e) {}
      return null;
    };

    let data = await fetchWithTimeout(`https://corsproxy.io/?${encodeURIComponent(target)}`);
    if (data && (data.results || data.id)) return data;

    data = await fetchWithTimeout(`https://api.allorigins.win/get?url=${encodeURIComponent(target)}`);
    if (data && data.contents) {
      try { return JSON.parse(data.contents); } catch(e){}
    }
    return null;
  }

  // LIVE SEARCH SUGGESTIONS
  let searchTimeout = null;
  searchInput.addEventListener("input", (e) => {
    clearTimeout(searchTimeout);
    const q = e.target.value.trim().toLowerCase();
    const suggestionsBox = document.getElementById("suggestionsBox");
    if (!q) { suggestionsBox.hidden = true; suggestionsBox.innerHTML = ""; return; }

    searchTimeout = setTimeout(async () => {
      const res = await api(`/search/multi?query=${encodeURIComponent(q)}`);
      let items = res && res.results ? res.results : [];
      if (items.length === 0) { suggestionsBox.hidden = true; return; }

      suggestionsBox.hidden = false;
      suggestionsBox.innerHTML = items.slice(0, 8).map(i => `
        <div class="suggestion-item" data-id="${i.id}" data-kind="${i.media_type || 'tv'}">
          <span>🎬 ${titleOf(i)}</span>
          <span style="color:var(--muted); font-size:.8rem;">${yearOf(i)}</span>
        </div>
      `).join("");
    }, 250);
  });

  document.addEventListener("click", (e) => {
    const item = e.target.closest(".suggestion-item");
    if (item) {
      document.getElementById("suggestionsBox").hidden = true;
      searchInput.value = "";
      openDetails(Number(item.dataset.id), item.dataset.kind);
    }
  });

  document.getElementById("searchForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    document.getElementById("suggestionsBox").hidden = true;
    const q = searchInput.value.trim();
    if (!q) return;
    const res = await api(`/search/multi?query=${encodeURIComponent(q)}`);
    let items = res && res.results ? res.results : [];
    resultsTitle.textContent = `Search Results: ${q}`;
    resultsEl.className = "grid";
    resultsEl.innerHTML = items.map(i => cardMarkup(i, i.media_type || "tv")).join("");
  });

  function titleOf(i) { return i.title || i.name || i.original_title || "Untitled"; }
  function yearOf(i) { return (i.release_date || i.first_air_date || "2026").slice(0,4); }

  function cardMarkup(item, kind) {
    return `
      <article class="card" data-id="${item.id}" data-kind="${kind || item.media_type || 'tv'}">
        <img class="poster" loading="lazy" src="${item.poster_path ? IMG + item.poster_path : ''}" alt="" onerror="this.src=''">
        <div class="card-info">
          <p class="card-title">${titleOf(item)}</p>
          <div style="display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted);">
            <span>${yearOf(item)}</span>
            <span style="color:var(--accent); font-weight:700;">★ ${Number(item.vote_average||0).toFixed(1)}</span>
          </div>
        </div>
      </article>
    `;
  }

  let carouselList = [];
  function setupCarousel(list) {
    carouselList = list.slice(0, 5);
    const item = carouselList[0];
    if (!item) return;
    heroBanner.style.backgroundImage = `url('${item.backdrop_path ? IMG_ORIG + item.backdrop_path : IMG_ORIG + item.poster_path}')`;
    document.getElementById("heroTitle").textContent = titleOf(item);
    document.getElementById("heroRating").textContent = `★ ${Number(item.vote_average||0).toFixed(1)}`;
    document.getElementById("heroYear").textContent = yearOf(item);
    document.getElementById("heroOverview").textContent = item.overview || "Stream top reality shows and serials now.";
  }

  document.getElementById("heroPlayBtn").addEventListener("click", () => {
    if (carouselList[0]) openDetails(carouselList[0].id, carouselList[0].media_type || "tv");
  });

  const FOOTBALL_MATCHES = [
    { id: "f1", title: "Al Nassr vs Al Hilal", league: "Saudi Pro League (Ronaldo ⚽)", status: "LIVE NOW", isLive: true, bg: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=800&q=80", url: "https://vidsrc.to/embed/movie/550" },
    { id: "f2", title: "Real Madrid vs Man City", league: "UEFA Champions League", status: "Tonight 12:30 AM", isLive: false, bg: "https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=800&q=80", url: "https://vidsrc.to/embed/movie/551" }
  ];

  let currentKind = "all";
  async function loadContent(kind = currentKind) {
    currentKind = kind;
    document.body.setAttribute("data-theme", kind);
    detailSection.hidden = true; heroBanner.hidden = false; resultsSection.hidden = false; pluginsSection.hidden = true;
    document.querySelectorAll("#categoryTabs button").forEach(b => b.classList.toggle("active", b.dataset.kind === kind));

    if (kind === "football") {
      heroBanner.hidden = true;
      resultsTitle.textContent = "⚽ Live Sports & Tournaments";
      resultsEl.className = "grid";
      resultsEl.innerHTML = FOOTBALL_MATCHES.map(m => `
        <div class="card" data-furl="${m.url}" data-ftitle="${m.title}" style="padding:16px;">
          <span style="color:var(--accent); font-size:.75rem; font-weight:800;">${m.status}</span>
          <h3 style="margin:8px 0; font-size:1rem;">${m.title}</h3>
          <p style="color:var(--muted); font-size:.8rem;">${m.league}</p>
          <button style="width:100%; margin-top:10px; font-size:.85rem;">▶ Watch Live</button>
        </div>
      `).join("");
      return;
    }

    resultsEl.className = "grid";
    let lists = [];

    if (kind === "all") {
      const [p1, p2, p3] = await Promise.all([
        api("/trending/tv/week?page=1"),
        api("/trending/tv/week?page=2"),
        api("/trending/movie/week?page=1")
      ]);
      lists = [
        ...(p1?.results || []).map(x => ({...x, media_type: "tv"})),
        ...(p2?.results || []).map(x => ({...x, media_type: "tv"})),
        ...(p3?.results || []).map(x => ({...x, media_type: "movie"}))
      ];
    } else if (kind === "reality") {
      // Reality shows like Bigg Boss, Khatron Ke Khiladi style query (TV genre Reality or Talk/Game show)
      const d = await api("/discover/tv?with_genres=10764&sort_by=popularity.desc&page=1");
      lists = (d?.results || []).map(x => ({...x, media_type: "tv"}));
    } else if (kind === "serials") {
      // Indian / Hindi TV Serials style query
      const d = await api("/discover/tv?with_original_language=hi&sort_by=popularity.desc&page=1");
      lists = (d?.results || []).map(x => ({...x, media_type: "tv"}));
    } else if (kind === "movie") {
      const d = await api("/movie/popular?page=1");
      lists = (d?.results || []).map(x => ({...x, media_type: "movie"}));
    } else if (kind === "anime") {
      const d = await api("/discover/tv?with_genres=16&sort_by=popularity.desc&page=1");
      lists = (d?.results || []).map(x => ({...x, media_type: "tv"}));
    }

    lists = Array.from(new Set(lists.map(a => a.id))).map(id => lists.find(a => a.id === id));

    setupCarousel(lists);
    resultsEl.innerHTML = lists.map(i => cardMarkup(i, i.media_type || 'tv')).join("");
  }

  const SERVERS = [
    { id: "vidsrc", name: "Hungama HD Mirror 1" },
    { id: "multiembed", name: "Reality Server 2" },
    { id: "autoembed", name: "VIP Express 3" }
  ];

  function getPlayerUrl(id, kind, season=1, ep=1, server="vidsrc") {
    if (kind === "movie") {
      if (server === "vidsrc") return `https://vidsrc.cc/v2/embed/movie/${id}`;
      if (server === "multiembed") return `https://multiembed.mov/?video_id=${id}&tmdb=1`;
      return `https://player.autoembed.cc/embed/movie/${id}`;
    } else {
      if (server === "vidsrc") return `https://vidsrc.cc/v2/embed/tv/${id}/${season}/${ep}`;
      if (server === "multiembed") return `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${season}&e=${ep}`;
      return `https://player.autoembed.cc/embed/tv/${id}/${season}/${ep}`;
    }
  }

  async function openDetails(id, kind) {
    detailSection.hidden = true; heroBanner.hidden = true; resultsSection.hidden = true; pluginsSection.hidden = true;
    let data = await api(`/${kind}/${id}?append_to_response=seasons`);
    if (!data) return;
    
    detailSection.innerHTML = `
      <button type="button" class="secondary" id="backBtn" style="margin-bottom:20px;">← Back</button>
      <div class="detail">
        <img src="${data.poster_path ? IMG + data.poster_path : ''}" alt="">
        <div>
          <h1>${titleOf(data)}</h1>
          <div style="display:flex; gap:10px; margin:10px 0; align-items:center; flex-wrap:wrap;">
            <span style="color:var(--accent); font-weight:700;">★ ${Number(data.vote_average||0).toFixed(1)}</span>
            <span style="font-size:.85rem; color:var(--muted);">${yearOf(data)}</span>
          </div>
          <p style="color:var(--muted); line-height:1.6;">${data.overview||"No description available."}</p>
          ${kind === "movie" ? `<button id="playMovieBtn" style="margin-top:16px;">▶ Watch Full Stream</button>` : ""}
        </div>
      </div>

      <div id="projectionBox" class="projection-container" ${kind === 'movie' ? 'hidden' : ''}>
        <div class="projection-header"><strong>STREAM PLAYER (HD QUALITY)</strong></div>
        <div class="projection-player"><iframe id="videoIframe" class="player-frame" allowfullscreen></iframe></div>
        <div class="servers-grid">
          ${SERVERS.map((s, idx) => `<div class="server-card ${idx===0?'active':''}" data-server="${s.id}">${s.name}</div>`).join("")}
        </div>
      </div>

      ${kind === "tv" ? `
        <div class="section-head" style="margin-top:30px;"><h2>Seasons & Episodes (Bigg Boss / Serials)</h2></div>
        <div class="episodes" id="episodesList" style="display:grid; gap:12px;"></div>
      ` : ""}
    `;

    detailSection.hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });

    document.getElementById("backBtn").addEventListener("click", () => {
      detailSection.hidden = true; heroBanner.hidden = false; resultsSection.hidden = false;
    });

    let activeServer = "vidsrc";
    let curSeason = 1, curEp = 1;
    const projectionBox = document.getElementById("projectionBox");
    const videoIframe = document.getElementById("videoIframe");

    function loadPlayer() {
      videoIframe.src = getPlayerUrl(id, kind, curSeason, curEp, activeServer);
      projectionBox.hidden = false;
      projectionBox.scrollIntoView({ behavior: 'smooth' });
    }

    if (kind === "movie") {
      document.getElementById("playMovieBtn").addEventListener("click", loadPlayer);
    } else {
      loadPlayer();
    }

    document.querySelectorAll(".server-card").forEach(sc => {
      sc.addEventListener("click", () => {
        document.querySelectorAll(".server-card").forEach(x => x.classList.remove("active"));
        sc.classList.add("active");
        activeServer = sc.dataset.server;
        if (!projectionBox.hidden) loadPlayer();
      });
    });

    if (kind === "tv" && data.seasons) {
      const seasons = data.seasons.filter(s => s.season_number >= 0);
      const epContainer = document.getElementById("episodesList");
      epContainer.innerHTML = seasons.map(s => `
        <div class="card" style="padding:16px;">
          <h4>${s.name}</h4>
          <p style="color:var(--muted); font-size:.85rem; margin:4px 0 10px;">${s.episode_count || 'Multiple'} Episodes</p>
          <button type="button" class="secondary seasonBtn" data-season="${s.season_number}" style="padding:6px 14px; font-size:.85rem;">View Episodes</button>
          <div class="seasonContent" id="season-ep-${s.season_number}" style="margin-top:10px;"></div>
        </div>
      `).join("");

      epContainer.querySelectorAll(".seasonBtn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const sNum = btn.dataset.season;
          const target = document.getElementById(`season-ep-${sNum}`);
          if (target.dataset.loaded === "1") { target.innerHTML = ""; target.dataset.loaded = "0"; btn.textContent = "View Episodes"; return; }
          btn.textContent = "Loading...";
          try {
            const sData = await api(`/tv/${id}/season/${sNum}`);
            target.innerHTML = (sData.episodes||[]).map(ep => `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);">
                <div><strong>E${ep.episode_number}. ${ep.name}</strong></div>
                <button type="button" class="playEpBtn" data-s="${sNum}" data-e="${ep.episode_number}" style="background:var(--accent); color:#000; border:0; border-radius:8px; padding:6px 14px; font-size:.8rem; font-weight:800; cursor:pointer;">▶ Play</button>
              </div>
            `).join("");
            target.dataset.loaded = "1";
            btn.textContent = "Hide Episodes";

            target.querySelectorAll(".playEpBtn").forEach(eb => {
              eb.addEventListener("click", () => {
                curSeason = eb.dataset.s; curEp = eb.dataset.e;
                loadPlayer();
              });
            });
          } catch { btn.textContent = "Error loading"; }
        });
      });
    }
  }

  document.addEventListener("click", e => {
    const card = e.target.closest(".card");
    if (card && card.dataset.id) openDetails(Number(card.dataset.id), card.dataset.kind || "tv");
    
    const cardMatch = e.target.closest("[data-furl]");
    if (cardMatch) {
      detailSection.hidden = false; heroBanner.hidden = true; resultsSection.hidden = true; pluginsSection.hidden = true;
      detailSection.innerHTML = `
        <button class="secondary" id="backMatchBtn" style="margin-bottom:20px;">← Back</button>
        <h2>⚽ ${cardMatch.dataset.ftitle}</h2>
        <div class="projection-container">
          <div class="projection-player"><iframe src="${cardMatch.dataset.furl}" class="player-frame" allowfullscreen></iframe></div>
        </div>
      `;
      document.getElementById("backMatchBtn").addEventListener("click", () => {
        detailSection.hidden = true; heroBanner.hidden = false; resultsSection.hidden = false;
      });
    }
  });

  document.querySelectorAll("#categoryTabs button").forEach(b => {
    b.addEventListener("click", () => loadContent(b.dataset.kind));
  });

  loadContent("all");
})();
</script>
</body>
</html>
