<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0e">
<meta name="description" content="SUIII_STREAM — discover movies, TV shows, reality shows and anime.">
<title>SUIII_STREAM — Movies, Serials & Anime</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0e;--panel:rgba(20,20,25,.9);--panel-solid:#141419;--panel2:rgba(28,28,36,.95);--text:#f3f3f6;--muted:#9595a6;--accent:#f5c518;--accent-hover:#e0b010;--line:rgba(255,255,255,.08);--card-bg:rgba(19,19,24,.8);--glass-blur:blur(20px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:100;background:rgba(11,11,14,.88);backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--line)}
.top{max-width:1350px;margin:auto;padding:14px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:900;font-size:1.4rem;color:#fff;cursor:pointer;white-space:nowrap}.brand span{color:var(--accent)}
.search-container{position:relative;flex:1;max-width:600px}form{display:flex;gap:8px;width:100%}
input[type=search],select{min-width:0;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:12px;font:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent)}button{background:var(--accent);color:#000;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer}button:hover{background:var(--accent-hover)}button:disabled{opacity:.5;cursor:wait}button.secondary{background:var(--panel2);color:#fff;border:1px solid var(--line)}button.secondary:hover{border-color:var(--accent)}
main{max-width:1350px;margin:auto;padding:0 20px 60px}
.hero-feature{margin-top:24px;position:relative;border-radius:20px;overflow:hidden;min-height:400px;display:flex;align-items:flex-end;padding:40px;background:#17171d center/cover no-repeat;border:1px solid var(--line)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,14,.05),rgba(11,11,14,.78) 65%,var(--bg)),linear-gradient(90deg,rgba(11,11,14,.8),rgba(11,11,14,.2) 65%,transparent)}
.hero-content{position:relative;z-index:2;max-width:650px}.hero-content h1{font-size:clamp(2rem,4vw,3.2rem);line-height:1.12;margin:8px 0 12px;font-weight:900}.hero-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;color:#d1d1d6}.gold{color:var(--accent);font-weight:800}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 20px}.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:10px 15px;font-weight:700}.tabs button.active{background:var(--accent);color:#000;border-color:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}.toolbar select{width:auto;max-width:190px}.toolbar .secondary{font-size:.9rem}
.section-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.section-head h2{font-size:1.3rem;margin:8px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:20px}
.card{background:var(--card-bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s;min-width:0}.card:hover,.card:focus{transform:translateY(-4px);border-color:var(--accent);outline:none}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#1a1a24;display:block}.card-info{padding:12px}.card-title{font-weight:750;font-size:.92rem;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-meta{display:flex;justify-content:space-between;gap:6px;font-size:.8rem;color:var(--muted)}.rating{color:var(--accent);font-weight:800}.source{font-size:.72rem;color:var(--muted);margin-top:6px}
.status{padding:25px 5px;color:var(--muted)}.status.error{color:#ffb0a9}.status a{color:var(--accent)}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px;margin-top:24px}.detail-layout{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:30px}.detail-poster{width:100%;border-radius:16px;display:block;background:#17171d;aspect-ratio:2/3;object-fit:cover}.detail h1{margin:5px 0 12px;line-height:1.15}.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.detail-actions a{color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:8px 11px;border-radius:9px}.detail-actions a:hover{border-color:var(--accent)}.projection-container{margin-top:24px;background:var(--card-bg);border:1px solid var(--line);border-radius:20px;overflow:hidden}.projection-header{padding:16px 20px;background:var(--panel2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.projection-player{width:100%;aspect-ratio:16/9;background:#000;display:grid;place-items:center;text-align:center;padding:20px}.player-frame{width:100%;height:100%;border:0}.servers-grid{display:flex;gap:10px;flex-wrap:wrap;padding:16px}.server-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:center;font-size:.85rem;font-weight:700;color:var(--text)}.server-card.active{border-color:var(--accent);color:var(--accent)}.notice{padding:13px 15px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:.9rem;margin-top:14px}.notice a{color:var(--accent)}
footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:var(--muted);margin-top:50px;background:var(--panel)}footer a{color:var(--accent);text-decoration:none;font-weight:700}[hidden]{display:none!important}
@media(max-width:768px){.detail-layout{grid-template-columns:1fr}.detail-poster{max-width:230px}.detail{padding:20px}.hero-feature{min-height:350px;padding:25px}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}}
@media(max-width:480px){.top{padding:12px}.brand{font-size:1.2rem}.search-container{flex-basis:100%;max-width:none}main{padding:0 12px 40px}.hero-feature{min-height:320px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card-info{padding:9px}.tabs{margin-top:22px}.detail{padding:14px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand" id="brandHome" role="button" tabindex="0">SUIII<span>_STREAM</span></div>
    <div class="search-container">
      <form id="searchForm" autocomplete="off">
        <input id="searchInput" type="search" placeholder="Search Bigg Boss, serials, movies, anime..." aria-label="Search titles">
        <button id="searchButton" type="submit">Search</button>
      </form>
    </div>
  </div>
</header>

<main id="app">
  <section id="heroBanner" class="hero-feature">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="gold">SUIII_STREAM · DISCOVER</div>
      <h1 id="heroTitle">Find your next favourite</h1>
      <div class="hero-meta"><span class="gold" id="heroRating">Movies · TV · Anime</span><span id="heroYear">Updated discovery</span></div>
      <p id="heroDescription" style="color:var(--muted);margin-bottom:20px">Discover popular movies, Indian reality shows, TV serials and anime.</p>
      <button type="button" id="heroPlayBtn">Explore Trending</button>
    </div>
  </section>

  <nav class="tabs" id="categoryTabs" aria-label="Content categories">
    <button data-kind="trending" class="active">🔥 Trending</button>
    <button data-kind="biggboss">👁️ Bigg Boss & Reality</button>
    <button data-kind="serials">📺 TV Serials</button>
    <button data-kind="movies">🎬 Movies</button>
    <button data-kind="anime">🌸 Anime</button>
  </nav>

  <div class="toolbar">
    <label for="sourceFilter" class="muted">Search source:</label>
    <select id="sourceFilter" aria-label="Search source">
      <option value="all">All supported sources</option>
      <option value="tmdb">TMDB</option>
      <option value="tvmaze">TVmaze</option>
      <option value="anime">Anime databases</option>
    </select>
    <button id="retryButton" class="secondary" type="button">↻ Refresh</button>
  </div>

  <section id="resultsSection">
    <div class="section-head"><h2 id="resultsTitle">Top Trending Content</h2><span id="resultCount" class="muted"></span></div>
    <div id="status" class="status">Preparing catalog...</div>
    <div id="results" class="grid"></div>
    <div id="pagination" style="display:flex;justify-content:center;gap:10px;margin-top:22px" hidden>
      <button id="prevPage" class="secondary" type="button">← Previous</button>
      <span id="pageLabel" class="muted" style="align-self:center"></span>
      <button id="nextPage" class="secondary" type="button">Next →</button>
    </div>
  </section>

  <section id="detailSection" hidden></section>
</main>

<footer>© <span id="year"></span> SUIII_STREAM · Created with ❤️ by <a href="https://t.me/MG1SHWE" target="_blank" rel="noopener noreferrer">@MG1SHWE</a></footer>

<script>
(() => {
"use strict";

/* Paste your TMDB API key below. For a public GitHub repo, a backend proxy is safer. */
const TMDB_API_KEY = "16b1113a76da76e67da63f74fe3f3e82";
const TMDB_BASE = "https://api.themoviedb.org/3";
const TMDB_IMAGE = "https://image.tmdb.org/t/p/w500";
const TMDB_BACKDROP = "https://image.tmdb.org/t/p/w1280";

const $ = id => document.getElementById(id);
const resultsEl = $("results");
const resultsTitle = $("resultsTitle");
const resultsSection = $("resultsSection");
const detailSection = $("detailSection");
const heroBanner = $("heroBanner");
const statusEl = $("status");
const searchInput = $("searchInput");
const sourceFilter = $("sourceFilter");

let currentItems = [];
let currentCategory = "trending";
let currentQuery = "";
let currentPage = 1;
let currentMode = "catalog";
let requestToken = 0;
const cache = new Map();

$("year").textContent = new Date().getFullYear();

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}
function imageURL(path) { return path ? TMDB_IMAGE + path : ""; }
function backdropURL(path) { return path ? TMDB_BACKDROP + path : ""; }
function hasTMDBKey() {
  return TMDB_API_KEY && TMDB_API_KEY !== "YOUR_TMDB_API_KEY";
}
async function fetchJSON(url, options = {}) {
  const response = await fetch(url, options);
  if (!response.ok) throw new Error("Request failed (" + response.status + ")");
  return response.json();
}
async function tmdb(path, params = {}) {
  if (!hasTMDBKey()) throw new Error("Add your TMDB API key in the script configuration first.");
  const url = new URL(TMDB_BASE + path);
  url.searchParams.set("api_key", TMDB_API_KEY);
  url.searchParams.set("language", "en-US");
  Object.entries(params).forEach(([k,v]) => {
    if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
  });
  return fetchJSON(url.toString());
}
async function cached(key, fn) {
  if (cache.has(key)) return cache.get(key);
  const result = await fn();
  cache.set(key, result);
  return result;
}
function normalizeTMDB(item, forcedType) {
  const type = forcedType || item.media_type ||
    (item.title ? "movie" : "tv");
  return {
    id: "tmdb-" + item.id, tmdbId: item.id, imdbId: item.imdb_id || null,
    title: item.title || item.name || "Untitled",
    year: (item.release_date || item.first_air_date || "").slice(0,4),
    overview: item.overview || "No description available.",
    poster: imageURL(item.poster_path), backdrop: backdropURL(item.backdrop_path),
    rating: item.vote_average || 0, type, provider: "TMDB",
    category: type === "movie" ? "movies" : "serials", raw: item
  };
}
function normalizeTVmaze(item) {
  const show = item.show || item;
  return {
    id: "tvmaze-" + show.id, externalId: show.id,
    title: show.name || "Untitled",
    year: (show.premiered || "").slice(0,4),
    overview: (show.summary || "No description available.").replace(/<[^>]*>/g," "),
    poster: show.image?.original || show.image?.medium || "", backdrop: "",
    rating: show.rating?.average || 0, type: "tv", provider: "TVmaze",
    category: "serials", raw: show
  };
}
function normalizeJikan(item) {
  return {
    id: "jikan-" + item.mal_id, externalId: item.mal_id,
    title: item.title || "Untitled Anime",
    year: item.year || item.aired?.prop?.from?.year || "",
    overview: item.synopsis || "No description available.",
    poster: item.images?.jpg?.large_image_url || item.images?.jpg?.image_url || "",
    backdrop: "", rating: item.score || 0, type: "anime",
    provider: "Jikan", category: "anime", raw: item
  };
}
function normalizeAniList(item) {
  return {
    id: "anilist-" + item.id, externalId: item.id,
    title: item.title?.english || item.title?.romaji || "Untitled Anime",
    year: item.seasonYear || "", overview: (item.description || "No description available.").replace(/<[^>]*>/g," "),
    poster: item.coverImage?.large || "", backdrop: item.bannerImage || "",
    rating: item.averageScore ? item.averageScore / 10 : 0,
    type: "anime", provider: "AniList", category: "anime", raw: item
  };
}
function dedupe(items) {
  const seen = new Set();
  return items.filter(item => {
    const key = item.title.toLowerCase().replace(/[^a-z0-9]/g,"");
    if (!key || seen.has(key)) return false;
    seen.add(key); return true;
  });
}
function cardMarkup(item, index) {
  const title = escapeHTML(item.title);
  const poster = escapeHTML(item.poster || "");
  const rating = Number(item.rating) > 0 ? "★ " + Number(item.rating).toFixed(1) : "Rating N/A";
  const fallback = "https://placehold.co/500x750/17171d/f5c518?text=No+Poster";
  return `<article class="card" data-index="${index}" tabindex="0" role="button" aria-label="Details for ${title}">
    <img class="poster" loading="lazy" src="${poster || fallback}" alt="${title} poster" onerror="this.onerror=null;this.src='${fallback}'">
    <div class="card-info"><p class="card-title">${title}</p>
    <div class="card-meta"><span>${escapeHTML(item.year || "Year N/A")}</span><span class="rating">${escapeHTML(rating)}</span></div>
    <div class="source">${escapeHTML(item.provider)}</div></div></article>`;
}
function renderItems(items) {
  currentItems = items;
  resultsEl.innerHTML = items.map(cardMarkup).join("");
  $("resultCount").textContent = items.length ? items.length + " results" : "";
  statusEl.hidden = items.length > 0;
  statusEl.classList.remove("error");
  statusEl.textContent = items.length ? "" : "No results found. Try another title or source.";
  $("pagination").hidden = true;
}
function setLoading(message) {
  resultsEl.innerHTML = "";
  $("resultCount").textContent = "";
  statusEl.hidden = false; statusEl.classList.remove("error");
  statusEl.textContent = message;
  $("pagination").hidden = true;
}
function setError(message) {
  resultsEl.innerHTML = "";
  statusEl.hidden = false; statusEl.classList.add("error");
  statusEl.textContent = message;
}
async function searchTMDB(query, category = "all", page = 1) {
  let data;
  if (category === "movies") data = await tmdb("/search/movie", {query, page, include_adult:"false"});
  else if (category === "serials" || category === "biggboss") data = await tmdb("/search/tv", {query, page});
  else data = await tmdb("/search/multi", {query, page, include_adult:"false"});
  return (data.results || []).filter(x => {
    const type = x.media_type || (x.title ? "movie" : "tv");
    return ["movie","tv"].includes(type);
  }).map(x => normalizeTMDB(x, category === "movies" ? "movie" : category === "serials" || category === "biggboss" ? "tv" : undefined));
}
async function searchTVmaze(query) {
  const data = await fetchJSON("https://api.tvmaze.com/search/shows?q=" + encodeURIComponent(query));
  return data.map(normalizeTVmaze);
}
async function searchJikan(query) {
  const data = await fetchJSON("https://api.jikan.moe/v4/anime?q=" + encodeURIComponent(query) + "&limit=15&sfw=true");
  return (data.data || []).map(normalizeJikan);
}
async function searchAniList(query) {
  const queryText = `query ($search: String) { Page(page:1,perPage:15) { media(search:$search,type:ANIME,isAdult:false) { id title { english romaji } description(asHtml:false) seasonYear averageScore coverImage { large } bannerImage } } }`;
  const data = await fetchJSON("https://graphql.anilist.co", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({query:queryText,variables:{search:query}})
  });
  if (data.errors?.length) throw new Error("AniList search unavailable");
  return (data.data?.Page?.media || []).map(normalizeAniList);
}
async function runSearch(query, category) {
  const source = sourceFilter.value;
  const jobs = [];
  if ((source === "all" || source === "tmdb") &&
      ["all","movies","serials","biggboss"].includes(category)) jobs.push(searchTMDB(query,category));
  if ((source === "all" || source === "tvmaze") &&
      ["all","serials","biggboss"].includes(category)) jobs.push(searchTVmaze(query));
  if ((source === "all" || source === "anime") &&
      ["all","anime"].includes(category)) {
    jobs.push(searchJikan(query)); jobs.push(searchAniList(query));
  }
  const settled = await Promise.allSettled(jobs);
  const results = settled.filter(x => x.status === "fulfilled").flatMap(x => x.value);
  if (!results.length && settled.every(x => x.status === "rejected")) {
    throw new Error("All selected sources failed. Check your connection, API key or try another source.");
  }
  let items = dedupe(results);
  if (category === "movies") items = items.filter(x => x.type === "movie");
  if (category === "serials" || category === "biggboss") items = items.filter(x => x.type === "tv");
  if (category === "anime") items = items.filter(x => x.type === "anime");
  return items;
}
async function loadCatalog(category = "trending") {
  currentCategory = category; currentMode = "catalog"; currentQuery = ""; currentPage = 1;
  const token = ++requestToken;
  detailSection.hidden = true; heroBanner.hidden = false; resultsSection.hidden = false;
  document.querySelectorAll("#categoryTabs button").forEach(b => b.classList.toggle("active",b.dataset.kind === category));
  const labels = {trending:"Top Trending Content",biggboss:"Bigg Boss & Reality",serials:"Popular TV Serials",movies:"Popular Movies",anime:"Popular Anime"};
  resultsTitle.textContent = labels[category] || "Discover";
  setLoading("Loading live catalog...");
  try {
    let items = [];
    if (category === "trending") {
      const data = await cached("trending-week", () => tmdb("/trending/all/week",{page:1}));
      items = (data.results || []).filter(x => ["movie","tv"].includes(x.media_type)).map(x => normalizeTMDB(x));
    } else if (category === "movies") {
      const data = await cached("popular-movies", () => tmdb("/movie/popular",{page:1}));
      items = (data.results || []).map(x => normalizeTMDB(x,"movie"));
    } else if (category === "serials") {
      const data = await cached("popular-tv", () => tmdb("/tv/popular",{page:1}));
      items = (data.results || []).map(x => normalizeTMDB(x,"tv"));
    } else if (category === "anime") {
      const settled = await Promise.allSettled([searchJikan("popular"),searchAniList("popular")]);
      items = dedupe(settled.filter(x=>x.status==="fulfilled").flatMap(x=>x.value));
      if (!items.length) throw new Error("Anime sources are temporarily unavailable.");
    } else if (category === "biggboss") {
      const settled = await Promise.allSettled([searchTMDB("Bigg Boss","biggboss"),searchTVmaze("Bigg Boss"),searchTMDB("reality show","serials")]);
      items = dedupe(settled.filter(x=>x.status==="fulfilled").flatMap(x=>x.value));
      if (!items.length) throw new Error("Reality-show sources are temporarily unavailable.");
    }
    if (token !== requestToken) return;
    renderItems(items);
  } catch (error) {
    if (token !== requestToken) return;
    console.error(error);
    setError(error.message || "Could not load catalog. Check your connection and settings.");
  }
}
async function submitSearch(query, category = "all") {
  query = query.trim();
  if (!query) return;
  currentMode = "search"; currentQuery = query; currentCategory = category; currentPage = 1;
  const token = ++requestToken;
  heroBanner.hidden = true; detailSection.hidden = true; resultsSection.hidden = false;
  document.querySelectorAll("#categoryTabs button").forEach(b => b.classList.toggle("active",b.dataset.kind === category));
  resultsTitle.textContent = 'Search Results: "' + query + '"';
  setLoading("Searching selected metadata sources...");
  try {
    const items = await runSearch(query,category);
    if (token !== requestToken) return;
    renderItems(items);
    if (!items.length) statusEl.textContent = "No matches found. Try a shorter title or change the source filter.";
  } catch (error) {
    if (token !== requestToken) return;
    console.error(error); setError(error.message || "Search failed. Please try again.");
  }
}
function externalLinks(item, imdbId) {
  const q = encodeURIComponent(item.title);
  const links = [];
  if (item.tmdbId) links.push(["TMDB","https://www.themoviedb.org/"+(item.type==="movie"?"movie/":"tv/")+encodeURIComponent(item.tmdbId)]);
  links.push(["IMDb",imdbId ? "https://www.imdb.com/title/"+encodeURIComponent(imdbId)+"/" : "https://www.imdb.com/find/?q="+q]);
  links.push(["JustWatch","https://www.justwatch.com/us/search?q="+q]);
  links.push(["Trakt","https://trakt.tv/search?query="+q]);
  links.push(["Letterboxd","https://letterboxd.com/search/"+q+"/"]);
  links.push(["Rotten Tomatoes","https://www.rottentomatoes.com/search?search="+q]);
  links.push(["Metacritic","https://www.metacritic.com/search/"+q+"/"]);
  return links.map(([label,url])=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`).join("");
}
async function openDetails(item) {
  const token = ++requestToken;
  heroBanner.hidden = true; resultsSection.hidden = true; detailSection.hidden = false;
  detailSection.innerHTML = '<div class="status">Loading title details...</div>';
  window.scrollTo({top:0,behavior:"smooth"});
  let imdbId = item.imdbId || null;
  if (item.provider === "TMDB" && item.tmdbId) {
    try {
      const endpoint = item.type === "movie" ? "/movie/"+item.tmdbId : "/tv/"+item.tmdbId;
      const data = await tmdb(endpoint,{append_to_response:"external_ids"});
      if (token !== requestToken) return;
      imdbId = data.imdb_id || data.external_ids?.imdb_id || imdbId;
      item.overview = data.overview || item.overview;
      item.backdrop = backdropURL(data.backdrop_path) || item.backdrop;
      item.raw = data;
    } catch (error) { console.warn("Extra metadata unavailable:",error); }
  }
  if (token !== requestToken) return;
  const title = escapeHTML(item.title);
  const poster = escapeHTML(item.poster || "");
  const overview = escapeHTML(item.overview || "No description available.");
  const year = escapeHTML(item.year || "Year unavailable");
  const rating = Number(item.rating)>0 ? Number(item.rating).toFixed(1) : "N/A";
  const backdrop = item.backdrop ? `style="background-image:linear-gradient(0deg,#141419,transparent),url('${escapeHTML(item.backdrop)}');background-size:cover;background-position:center"` : "";
  detailSection.innerHTML = `
    <button type="button" class="secondary" id="backBtn">← Back to results</button>
    <div class="detail" ${backdrop}>
      <div class="detail-layout">
        <div><img class="detail-poster" src="${poster || "https://placehold.co/500x750/17171d/f5c518?text=No+Poster"}" alt="${title} poster" onerror="this.onerror=null;this.src='https://placehold.co/500x750/17171d/f5c518?text=No+Poster'"></div>
        <div>
          <div class="gold">${escapeHTML(item.provider)} · ${escapeHTML(item.type.toUpperCase())}</div>
          <h1>${title}</h1>
          <div class="hero-meta"><span>${year}</span><span class="rating">★ ${rating}</span></div>
          <p>${overview}</p>
          <div class="detail-actions">${externalLinks(item,imdbId)}</div>
          <div class="notice">These links help you find metadata and legal viewing options. Availability varies by country and provider.</div>
        </div>
      </div>
      <div class="projection-container">
        <div class="projection-header"><strong>WATCH OPTIONS</strong><span class="muted">Official provider search</span></div>
        <div class="projection-player">
          <div><div style="font-size:1.15rem;font-weight:800">Find where to watch</div>
          <p class="muted">Choose a service below to check availability for this title.</p>
          <a href="https://www.justwatch.com/us/search?q=${encodeURIComponent(item.title)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">Search JustWatch ↗</a></div>
        </div>
        <div class="servers-grid">
          <a class="server-card" href="https://www.justwatch.com/us/search?q=${encodeURIComponent(item.title)}" target="_blank" rel="noopener noreferrer">JustWatch</a>
          <a class="server-card" href="https://www.netflix.com/search?q=${encodeURIComponent(item.title)}" target="_blank" rel="noopener noreferrer">Netflix search</a>
          <a class="server-card" href="https://www.primevideo.com/search/ref=atv_nb_sr?phrase=${encodeURIComponent(item.title)}" target="_blank" rel="noopener noreferrer">Prime Video search</a>
        </div>
      </div>
    </div>`;
  $("backBtn").addEventListener("click", () => {
    detailSection.hidden = true; resultsSection.hidden = false;
    heroBanner.hidden = currentMode === "search";
    window.scrollTo({top:0,behavior:"smooth"});
  });
}
$("searchForm").addEventListener("submit",event=>{event.preventDefault();submitSearch(searchInput.value,"all");});
$("categoryTabs").addEventListener("click",event=>{
  const button=event.target.closest("button[data-kind]");
  if(!button)return;
  const category=button.dataset.kind;
  if(searchInput.value.trim() && category !== "trending") submitSearch(searchInput.value,category);
  else loadCatalog(category);
});
$("brandHome").addEventListener("click",()=>{searchInput.value="";sourceFilter.value="all";loadCatalog("trending");});
$("brandHome").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("brandHome").click();}});
$("heroPlayBtn").addEventListener("click",()=>loadCatalog("trending"));
$("retryButton").addEventListener("click",()=>currentMode==="search" ? submitSearch(currentQuery,currentCategory) : loadCatalog(currentCategory));
resultsEl.addEventListener("click",event=>{
  const card=event.target.closest(".card");if(!card)return;
  const item=currentItems[Number(card.dataset.index)];if(item)openDetails(item);
});
resultsEl.addEventListener("keydown",event=>{
  if(event.key!=="Enter"&&event.key!==" ")return;
  const card=event.target.closest(".card");if(!card)return;
  event.preventDefault();const item=currentItems[Number(card.dataset.index)];if(item)openDetails(item);
});
sourceFilter.addEventListener("change",()=>{
  if(currentMode==="search"&&currentQuery)submitSearch(currentQuery,currentCategory);
});
if(!hasTMDBKey()){
  setError("Setup needed: open index.html and replace YOUR_TMDB_API_KEY with your TMDB API key. Anime searches can work independently.");
  $("heroTitle").textContent="Your entertainment hub";
} else {
  loadCatalog("trending");
}
})();
</script>
</body>
</html>
