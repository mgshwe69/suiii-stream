<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suiii Stream - Watch Movies & Series</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #e11d48;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            flex: 1;
        }

        .key-box {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .player-container {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .iframe-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .server-list {
            padding: 1rem;
            display: flex;
            gap: 10px;
            background: #0f172a;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .card-info {
            padding: 0.8rem;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            color: #22c55e;
            font-size: 0.85rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">SUI-STREAM</a>
        <span id="keyStatus">Key required</span>
    </header>

    <div class="container">
        <!-- Access Key Verification -->
        <div class="key-box" id="keyContainer">
            <input type="text" id="accessKeyInput" placeholder="Enter Access Key (e.g. Suiii-15D-...)">
            <button onclick="saveKey()">Activate Key</button>
        </div>

        <!-- Search Bar -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search movies, TV shows...">
            <button onclick="searchMedia()">Search</button>
        </div>

        <!-- Direct Watch Player -->
        <div class="player-container" id="playerContainer">
            <div class="iframe-wrapper">
                <iframe id="videoPlayer" allowfullscreen></iframe>
            </div>
            <div class="server-list">
                <span style="align-self: center; font-weight: 600;">Server:</span>
                <button onclick="switchServer(1)">Server 1 (vidsrc)</button>
                <button onclick="switchServer(2)">Server 2 (autoembed)</button>
                <button onclick="switchServer(3)">Server 3 (2embed)</button>
            </div>
        </div>

        <!-- Media Grid -->
        <div class="grid" id="mediaGrid"></div>
    </div>

    <script>
        let currentMedia = null;
        let activeKey = localStorage.getItem('suii_access_key') || '';

        if(activeKey) {
            document.getElementById('accessKeyInput').value = activeKey;
            document.getElementById('keyStatus').innerText = "Key Active";
            document.getElementById('keyStatus').className = "status";
        }

        function saveKey() {
            const val = document.getElementById('accessKeyInput').value.trim();
            if(val) {
                localStorage.setItem('suii_access_key', val);
                activeKey = val;
                document.getElementById('keyStatus').innerText = "Key Active";
                document.getElementById('keyStatus').className = "status";
                alert('Access Key saved successfully!');
            }
        }

        async function searchMedia() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return;

            try {
                const res = await fetch(`/.netlify/functions/tmdb?action=search&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                renderCards(data.results || []);
            } catch(e) {
                console.error(e);
                alert('Error fetching media');
            }
        }

        function renderCards(items) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';
            
            items.forEach(item => {
                if(!item.poster_path) return;
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playMedia(item);
                
                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="${item.title || item.name}">
                    <div class="card-info">
                        <div class="card-title">${item.title || item.name}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playMedia(item) {
            if(!activeKey) {
                alert('Please enter a valid Access Key first!');
                return;
            }

            currentMedia = item;
            document.getElementById('playerContainer').style.display = 'block';
            switchServer(1);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchServer(serverNum) {
            if(!currentMedia) return;
            const isMovie = !!currentMedia.title;
            const id = currentMedia.id;
            const iframe = document.getElementById('videoPlayer');

            if(serverNum === 1) {
                iframe.src = isMovie 
                    ? `https://vidsrc.to/embed/movie/${id}`
                    : `https://vidsrc.to/embed/tv/${id}/1/1`;
            } else if(serverNum === 2) {
                iframe.src = isMovie 
                    ? `https://player.autoembed.cc/embed/movie/${id}`
                    : `https://player.autoembed.cc/embed/tv/${id}/1/1`;
            } else if(serverNum === 3) {
                iframe.src = isMovie 
                    ? `https://www.2embed.cc/embed/${id}`
                    : `https://www.2embed.cc/embedtv/${id}&s=1&e=1`;
            }
        }

        // Auto load trending movies on launch
        async function loadTrending() {
            try {
                const res = await fetch(`/.netlify/functions/tmdb?action=trending`);
                const data = await res.json();
                renderCards(data.results || []);
            } catch(e) {
                console.error(e);
            }
        }

        loadTrending();
    </script>
</body>
</html>
