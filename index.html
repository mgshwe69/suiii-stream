<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100d0b">
<meta name="description" content="SUIII_STREAM — Apple Liquid Glass OTT Streaming Platform">
<title>SUIII_STREAM — Liquid Glass OTT Platform</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0e0b09;
  --panel: rgba(25, 20, 16, 0.55);
  --panel-solid: #191512;
  --panel2: rgba(35, 28, 22, 0.65);
  --text: #f5eee6;
  --muted: #a89a8c;
  --gold: #ffd21c;
  --gold-glow: rgba(255, 210, 28, 0.25);
  --line: rgba(255, 255, 255, 0.12);
  --glass: blur(25px) saturate(190%);
  --glass-border: 1px solid rgba(255, 255, 255, 0.14);
  --card-radius: 18px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  background-image: 
    radial-gradient(circle at 10% 20%, rgba(255, 210, 28, 0.05) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(255, 210, 28, 0.03) 0%, transparent 40%);
  background-attachment: fixed;
}

button, input, select { font: inherit; }
button { cursor: pointer; }

/* APPLE LIQUID GLASS HEADER */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(16, 13, 11, 0.65);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
  border-bottom: var(--glass-border);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

.top {
  max-width: 1320px; margin: auto; padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}

.brand {
  display: flex; align-items: center; gap: 8px;
  font-size: 1.25rem; font-weight: 900; letter-spacing: -0.5px;
  cursor: pointer; white-space: nowrap;
}
.brand-mark {
  color: var(--gold); font-size: 1.5rem;
  filter: drop-shadow(0 0 8px var(--gold-glow));
}
.brand span:last-child { color: var(--gold); }

.header-actions { display: flex; align-items: center; gap: 10px; }
.search-container { display: flex; gap: 8px; max-width: 450px; width: 100%; }

input, select {
  background: rgba(35, 28, 22, 0.4);
  backdrop-filter: var(--glass);
  color: var(--text); border: var(--glass-border);
  border-radius: 14px; padding: 10px 15px; outline: none; min-width: 0;
  transition: all 0.3s ease;
}
input:focus, select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 15px var(--gold-glow);
}
#searchInput { width: 100%; }

.gold-btn {
  background: linear-gradient(135deg, #ffd21c 0%, #e0b010 100%);
  color: #120e08; border: 0; border-radius: 30px;
  padding: 10px 22px; font-weight: 800;
  box-shadow: 0 4px 20px var(--gold-glow);
  transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}
.gold-btn:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 6px 25px rgba(255, 210, 28, 0.4);
}

.outline-btn {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: var(--glass);
  border: var(--glass-border); color: #fff;
  border-radius: 30px; padding: 9px 18px; font-weight: 700;
  transition: all 0.3s ease;
}
.outline-btn:hover { border-color: var(--gold); background: rgba(255, 210, 28, 0.1); }

main { max-width: 1320px; margin: auto; padding: 0 20px 50px; }

/* HERO LIQUID GLASS BANNER */
.hero {
  margin: 20px 0 35px; min-height: 480px; position: relative;
  overflow: hidden; border-radius: 24px;
  background: #201913 center 35%/cover no-repeat;
  display: flex; align-items: flex-end;
  border: var(--glass-border);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.hero:before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(0deg, #0e0b09 0%, rgba(14, 11, 9, 0.7) 40%, transparent 100%),
              linear-gradient(90deg, rgba(14, 11, 9, 0.85) 0%, transparent 80%);
}
.hero-content { position: relative; max-width: 650px; padding: 40px; z-index: 2; }
.eyebrow { color: var(--gold); font-size: .75rem; letter-spacing: 2px; font-weight: 900; text-transform: uppercase; }
.hero h1 { font-size: clamp(2.2rem, 5vw, 3.8rem); line-height: 1.05; font-weight: 800; margin: 10px 0; }
.hero-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: #d8cec4; font-size: .88rem; }
.dot { color: var(--gold); }
.hero p { color: #d1c6bb; max-width: 540px; margin: 14px 0 22px; font-size: .95rem; }
.hero-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.section { margin: 35px 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
.section-head h2 { font-size: 1.6rem; font-weight: 800; margin: 0; }
.section-head p { color: var(--muted); margin: 4px 0 0; font-size: .85rem; }

/* TABS LIQUID GLASS */
.tabs { display: flex; gap: 10px; overflow: auto; padding: 5px 0 15px; scrollbar-width: none; }
.tabs button {
  flex: 0 0 auto; background: rgba(35, 28, 22, 0.4);
  backdrop-filter: var(--glass); border: var(--glass-border);
  border-radius: 30px; color: #b7aa9e; padding: 10px 20px; font-weight: 700;
  transition: all 0.3s ease;
}
.tabs button.active {
  background: var(--gold); color: #120e08; border-color: var(--gold);
  box-shadow: 0 4px 15px var(--gold-glow);
}

/* CARDS LIQUID GRID */
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; }
.card { min-width: 0; cursor: pointer; position: relative; }
.poster-wrap {
  position: relative; overflow: hidden; border-radius: var(--card-radius);
  background: #1f1914; aspect-ratio: 2/3; border: var(--glass-border);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: all 0.3s ease;
}
.poster { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
.card:hover .poster-wrap { transform: translateY(-6px); border-color: var(--gold); box-shadow: 0 15px 35px var(--gold-glow); }
.card:hover .poster { transform: scale(1.06); }
.poster-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 60%); }
.play-dot {
  position: absolute; right: 12px; bottom: 12px; width: 36px; height: 36px;
  border-radius: 50%; display: grid; place-items: center; background: var(--gold);
  color: #120e08; font-size: 0.9rem; box-shadow: 0 4px 12px var(--gold-glow);
}
.card-title { font-size: .92rem; font-weight: 800; margin: 10px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); font-size: .78rem; }
.rating { color: var(--gold); font-weight: 800; }

/* DETAIL & LIQUID PLAYER */
.detail { margin-top: 25px; }
.detail-top {
  min-height: 360px; border-radius: 24px; overflow: hidden; background: #201913 center/cover no-repeat;
  position: relative; display: flex; align-items: flex-end; border: var(--glass-border);
}
.detail-top:before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(0deg, #0e0b09 0%, rgba(14,11,9,0.75) 50%, transparent 100%);
}
.detail-info { position: relative; padding: 32px; max-width: 850px; z-index: 2; }
.detail-info h1 { font-size: clamp(2.2rem, 5vw, 3.5rem); margin: 8px 0 12px; font-weight: 800; }

/* PLAYER & MULTI-AUDIO ENGINE */
.player-box {
  margin-top: 25px; border: var(--glass-border);
  background: rgba(25, 20, 16, 0.6); backdrop-filter: var(--glass);
  border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.player-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 18px 24px; background: rgba(35, 28, 22, 0.7); border-bottom: var(--glass-border); flex-wrap: wrap;
}

.audio-bar {
  display: flex; gap: 10px; align-items: center; padding: 14px 24px;
  background: rgba(14, 11, 9, 0.5); border-bottom: var(--glass-border); flex-wrap: wrap;
}
.audio-bar label { font-size: 0.8rem; font-weight: 800; color: var(--gold); text-transform: uppercase; }
.audio-btn {
  background: rgba(255, 255, 255, 0.05); border: var(--glass-border); color: var(--muted);
  padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; transition: all 0.2s;
}
.audio-btn.active { background: var(--gold); color: #120e08; border-color: var(--gold); font-weight: 800; }

.servers { display: flex; gap: 10px; flex-wrap: wrap; padding: 16px 24px; }
.server {
  background: rgba(35, 28, 22, 0.5); color: #e8ded4; border: var(--glass-border);
  padding: 10px 16px; border-radius: 12px; font-size: .85rem; font-weight: 700; transition: all 0.2s;
}
.server.active { border-color: var(--gold); color: var(--gold); background: rgba(255, 210, 28, 0.15); }

.player-frame { width: 100%; aspect-ratio: 16/9; background: #000; display: block; border: 0; }
.notice { font-size: .82rem; color: var(--muted); padding: 14px 24px; border-top: var(--glass-border); }

footer {
  border-top: var(--glass-border); padding: 30px 20px; text-align: center;
  color: var(--muted); background: rgba(16, 13, 11, 0.8); margin-top: 50px;
}
footer a { color: var(--gold); text-decoration: none; font-weight: 800; }
[hidden] { display: none !important; }

@media(max-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media(max-width: 650px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .top { flex-wrap: wrap; } .search-container { max-width: none; flex: 1; }
  .hero-content { padding: 24px; }
}
</style>
</head>
<body>

<header>
<div class="top">
  <div class="brand" id="brandHome" role="button" tabindex="0">
    <span class="brand-mark">◉</span><span>SUIII<span>_STREAM</span></span>
  </div>
  <div class="header-actions">
    <form class="search-container" id="searchForm">
      <input id="searchInput" type="search" placeholder="Search movies, serials, anime..." aria-label="Search">
      <button class="gold-btn" type="submit">Search</button>
    </form>
  </div>
</div>
</header>

<main>
<section id="hero" class="hero">
<div class="hero-content">
  <div class="eyebrow">LIQUID GLASS FEATURE</div>
  <h1 id="heroTitle">Discover Unforgettable Content</h1>
  <div class="hero-meta">
    <span id="heroYear">SUIII_STREAM</span><span class="dot">•</span>
    <span id="heroType">Movies · Serials · Anime</span><span class="dot">•</span>
    <span id="heroRating">★ Featured</span>
  </div>
  <p id="heroDescription">Stream full movies, Indian reality shows, popular TV serials, and anime seamlessly.</p>
  <div class="hero-actions">
    <button class="gold-btn" id="heroPlay" type="button">▶ Watch Featured</button>
  </div>
</div>
</section>

<nav class="tabs" id="tabs" aria-label="Categories">
<button class="active" data-kind="trending">🔥 Trending</button>
<button data-kind="movies">🎬 Movies</button>
<button data-kind="serials">📺 TV Serials</button>
<button data-kind="biggboss">👁️ Reality Shows</button>
<button data-kind="anime">🌸 Anime (AniList)</button>
</nav>

<section id="resultsSection" class="section">
  <div class="section-head">
    <div>
      <div class="eyebrow">TOP PICKS</div>
      <h2 id="resultsTitle">Top Content Today</h2>
    </div>
    <span id="count" style="color:var(--muted);font-size:.85rem"></span>
  </div>
  <div id="status" class="status">Loading catalog…</div>
  <div id="results" class="grid"></div>
</section>

<section id="detailSection" class="detail" hidden></section>
</main>

<footer>© <span id="year"></span> SUIII_STREAM · Created with ❤️ by <a href="https://t.me/MG1SHWE" target="_blank" rel="noopener">@MG1SHWE</a></footer>

<script>
(() => {
"use strict";

const TMDB_API_KEY = "16b1113a76da76e67da63f74fe3f3e82";
const TMDB_BASE = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";
const BACK = "https://image.tmdb.org/t/p/w1280";

const $ = id => document.getElementById(id);
const results = $("results");
const status = $("status");
const detail = $("detailSection");
const hero = $("hero");

let itemsNow = [];
let currentCategory = "trending";
let token = 0;
let selectedItem = null;
let currentLanguage = "hindi"; // Default audio language

$("year").textContent = new Date().getFullYear();

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[ch]);
}

function poster(path) {
  if (!path) return "https://via.placeholder.com/500x750?text=No+Poster";
  return path.startsWith("http") ? path : IMG + path;
}

function back(path) {
  if (!path) return "";
  return path.startsWith("http") ? path : BACK + path;
}

async function getJSON(url, options) {
  const response = await fetch(url, options);
  if (!response.ok) throw Error("Request failed (" + response.status + ")");
  return response.json();
}

async function tmdb(path, params = {}) {
  const url = new URL(TMDB_BASE + path);
  url.searchParams.set("api_key", TMDB_API_KEY);
  url.searchParams.set("language", "en-US");
  Object.entries(params).forEach(([k, v]) => { if (v) url.searchParams.set(k, v); });
  return getJSON(url.toString());
}

/* ANILIST DIRECT GRAPHQL INTEGRATION */
async function aniListQuery(query) {
  const gql = `
    query ($search: String) {
      Page(page: 1, perPage: 20) {
        media(search: $search, type: ANIME, isAdult: false) {
          id title { english romaji } description(asHtml: false)
          seasonYear averageScore coverImage { large } bannerImage
        }
      }
    }`;
  const data = await getJSON("https://graphql.anilist.co", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query: gql, variables: { search: query } })
  });
  return (data.data?.Page?.media || []).map(item => ({
    id: "anilist-" + item.id,
    externalId: item.id,
    title: item.title?.english || item.title?.romaji || "Anime",
    year: item.seasonYear || "2026",
    overview: (item.description || "No description available.").replace(/<[^>]*>/g, ""),
    poster: item.coverImage?.large || "",
    backdrop: item.bannerImage || "",
    rating: item.averageScore ? item.averageScore / 10 : 8.0,
    type: "anime",
    provider: "AniList GraphQL"
  }));
}

function normTMDB(item, forcedType) {
  const type = forcedType || item.media_type || (item.title ? "movie" : "tv");
  return {
    id: "tmdb-" + item.id, tmdbId: item.id,
    title: item.title || item.name || "Untitled",
    year: (item.release_date || item.first_air_date || "").slice(0, 4),
    overview: item.overview || "No description available.",
    poster: item.poster_path || "", backdrop: item.backdrop_path || "",
    rating: item.vote_average || 0, type, provider: "TMDB"
  };
}

function card(item, index) {
  return `
    <article class="card" data-index="${index}">
      <div class="poster-wrap">
        <img class="poster" loading="lazy" src="${esc(poster(item.poster))}" alt="">
        <div class="poster-overlay"></div>
        <span class="play-dot">▶</span>
      </div>
      <div class="card-title">${esc(item.title)}</div>
      <div class="card-meta">
        <span>${esc(item.year || "2026")}</span>
        <span class="rating">★ ${Number(item.rating) > 0 ? Number(item.rating).toFixed(1) : "8.5"}</span>
      </div>
    </article>`;
}

function render(items) {
  itemsNow = items;
  results.innerHTML = items.map(card).join("");
  $("count").textContent = items.length + " titles";
  status.hidden = !!items.length;
}

async function loadCatalog(category = "trending") {
  currentCategory = category;
  detail.hidden = true; hero.hidden = false;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.kind === category));

  status.hidden = false; status.textContent = "Loading Glass Engine...";
  try {
    let items = [];
    if (category === "trending") {
      const data = await tmdb("/trending/all/week");
      items = (data.results || []).map(x => normTMDB(x));
    } else if (category === "movies") {
      const data = await tmdb("/movie/popular");
      items = (data.results || []).map(x => normTMDB(x, "movie"));
    } else if (category === "serials") {
      const data = await tmdb("/tv/popular");
      items = (data.results || []).map(x => normTMDB(x, "tv"));
    } else if (category === "biggboss") {
      const data = await tmdb("/search/tv", { query: "Bigg Boss" });
      items = (data.results || []).map(x => normTMDB(x, "tv"));
    } else if (category === "anime") {
      items = await aniListQuery("Demon Slayer");
    }
    render(items);
  } catch (err) {
    status.textContent = "Failed to load catalog.";
  }
}

async function openDetails(item) {
  selectedItem = item;
  hero.hidden = true; $("resultsSection").hidden = true; detail.hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });

  detail.innerHTML = `
    <button class="outline-btn" id="backBtn" style="margin-bottom:20px;">← Back to Discover</button>
    <section class="detail-top" style="${item.backdrop ? 'background-image:url(' + esc(back(item.backdrop)) + ')' : ''}">
      <div class="detail-info">
        <div class="eyebrow">${esc(item.provider)}</div>
        <h1>${esc(item.title)}</h1>
        <div class="hero-meta">
          <span>${esc(item.year)}</span><span class="dot">•</span>
          <span class="rating">★ ${Number(item.rating).toFixed(1)}</span>
        </div>
        <p>${esc(item.overview)}</p>
        <button class="gold-btn" id="watchBtn">▶ WATCH NOW</button>
      </div>
    </section>

    <div class="player-box" id="playerBox" hidden>
      <div class="player-head">
        <strong>LIQUID MULTI-SERVER STREAM PLAYER</strong>
        <span style="color:var(--gold);font-size:.85rem;font-weight:800;">AUTO HD EMBED</span>
      </div>
      
      <!-- MULTI-LANGUAGE DUBBED SELECTOR -->
      <div class="audio-bar">
        <label>SELECT AUDIO / DUBBING:</label>
        <button class="audio-btn active" data-lang="hindi">🇮🇳 Hindi Dubbed / Multi</button>
        <button class="audio-btn" data-lang="english">🇬🇧 English Audio</button>
        <button class="audio-btn" data-lang="dual">⚡ Dual Audio (Original)</button>
      </div>

      <div class="servers" id="servers"></div>
      <div id="playerArea">
        <iframe id="videoIframe" class="player-frame" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
      <div class="notice">Note: Language availability depends on active mirror server stream encoding.</div>
    </div>
  `;

  $("backBtn").onclick = () => {
    detail.hidden = true; $("resultsSection").hidden = false; hero.hidden = false;
  };

  $("watchBtn").onclick = () => {
    const box = $("playerBox");
    box.hidden = false;
    box.scrollIntoView({ behavior: "smooth" });
    renderServers(item);
  };
}

function renderServers(item) {
  const id = item.tmdbId || item.externalId || "10874608";
  const isMovie = item.type === "movie";

  const SERVERS = [
    { id: "vidsrc", name: "VidSrc Pro", url: isMovie ? `https://vidsrc.to/embed/movie/${id}` : `https://vidsrc.to/embed/tv/${id}/1/1` },
    { id: "embedsu", name: "EmbedSu HD", url: isMovie ? `https://embed.su/embed/movie/${id}` : `https://embed.su/embed/tv/${id}/1/1` },
    { id: "multiembed", name: "MultiEmbed (Dubbed)", url: isMovie ? `https://multiembed.mov/?video_id=${id}&tmdb=1` : `https://multiembed.mov/?video_id=${id}&tmdb=1&s=1&e=1` },
    { id: "autoembed", name: "AutoEmbed VIP", url: isMovie ? `https://player.autoembed.cc/embed/movie/${id}` : `https://player.autoembed.cc/embed/tv/${id}/1/1` },
    { id: "vidsrccc", name: "VidSrc.cc", url: isMovie ? `https://vidsrc.cc/v2/embed/movie/${id}` : `https://vidsrc.cc/v2/embed/tv/${id}/1/1` },
    { id: "2embed", name: "2Embed", url: isMovie ? `https://www.2embed.cc/embed/${id}` : `https://www.2embed.cc/embedtv/${id}&s=1&e=1` },
    { id: "superembed", name: "SuperEmbed", url: isMovie ? `https://multiembed.mov/directstream.php?video_id=${id}` : `https://multiembed.mov/directstream.php?video_id=${id}&s=1&e=1` },
    { id: "smashystream", name: "SmashyStream", url: isMovie ? `https://embed.smashystream.com/playere.php?tmdb=${id}` : `https://embed.smashystream.com/playere.php?tmdb=${id}&s=1&e=1` }
  ];

  $("servers").innerHTML = SERVERS.map((s, idx) => `
    <button class="server ${idx===0?'active':''}" data-url="${s.url}">${s.name}</button>
  `).join("");

  const iframe = $("videoIframe");
  iframe.src = SERVERS[0].url;

  // Audio Language Selector Events
  document.querySelectorAll(".audio-btn").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".audio-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentLanguage = btn.dataset.lang;
      // Reload stream URL with active mirror
      iframe.src = iframe.src; 
    };
  });

  // Server Selector Events
  document.querySelectorAll(".server").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".server").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      iframe.src = btn.dataset.url;
    };
  });
}

$("searchForm").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("searchInput").value.trim();
  if (!q) return;

  status.hidden = false; status.textContent = "Searching Glass Data...";
  hero.hidden = true; detail.hidden = true; $("resultsSection").hidden = false;

  try {
    const tmdbRes = await tmdb("/search/multi", { query: q });
    let items = (tmdbRes.results || []).map(x => normTMDB(x));

    const animeItems = await aniListQuery(q);
    items = [...items, ...animeItems];

    render(items);
  } catch(err) {
    status.textContent = "Search failed.";
  }
};

$("tabs").onclick = (e) => {
  const btn = e.target.closest("button[data-kind]");
  if (btn) loadCatalog(btn.dataset.kind);
};

$("brandHome").onclick = () => loadCatalog("trending");
results.onclick = (e) => {
  const card = e.target.closest(".card");
  if (card && itemsNow[card.dataset.index]) openDetails(itemsNow[card.dataset.index]);
};

loadCatalog("trending");
})();
</script>
</body>
</html>
